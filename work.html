<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>alamilla | Project</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@100..900&display=swap" rel="stylesheet">
    <!-- The home's stylesheet (the nav, the fonts, the page's variables), then
         this page's own. -->
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/project.css" />
  </head>
  <body class="project grain">
    <!-- The aura behind the project's head (src/project-aura.js). -->
    <canvas class="pj-aura" aria-hidden="true"></canvas>
    <!-- The home's nav; its links go back to the home's sections. -->
    <nav id="site-nav">
      <a class="nav-home" href="index.html"><img class="nav-logo" src="/logo-alamilla-new.svg" alt="Alamilla" /></a>
      <ul class="nav-links">
        <li><a href="index.html#home">home</a></li>
        <li><a href="works.html">projects</a></li>
        <li><a href="index.html#showreel">showreel</a></li>
        <li><a href="index.html#experience">experience</a></li>
        <li><a href="index.html#about">about me</a></li>
        <li><a href="index.html#contact">contact</a></li>
      </ul>
      <!-- On a tablet and a phone, in the links' place: opens them as a
           whole screen (src/menu.js). -->
      <button class="nav-menu" type="button" aria-expanded="false" aria-controls="site-menu">menu</button>
      <p class="nav-clock"><span>valencia</span> <time id="nav-clock-time"></time></p>
    </nav>
    <!-- A project: one template for all of them, filled in by src/project.js
         from src/data/projects.js, for the project in the address
         (work.html#<slug>). -->
    <main class="pj"></main>
    <footer class="pj-foot">
      <span class="site-credit">&copy; 2026 Daniel Alamilla</span>
    </footer>
    <script type="module" src="/src/project.js"></script>
  </body>
</html>
